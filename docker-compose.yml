services:
  servidor:
    image: serversideup/php:8.3-cli
    container_name: mi_servidor_laravel
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    networks:
      - red_laravel
    depends_on:
      - base_datos

  base_datos:
    image: postgres:16-alpine
    container_name: mi_base_datos_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: laravel_curso
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    volumes:
      - datos_pg:/var/var/lib/postgresql/data
    networks:
      - red_laravel

networks:
  red_laravel:
    driver: bridge

volumes:
  datos_pg:
